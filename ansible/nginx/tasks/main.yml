---
# Variable setup.
- name: Include OS-specific variables
  ansible.builtin.include_vars:
    file: "{{ 'Ubuntu.yml' if ansible_facts.distribution == 'Ubuntu' else ansible_facts.os_family + '.yml' }}"
# - name: Include OS-specific variables
#   ansible.builtin.include_vars:
#     file: "{{ ansible_facts.os_family }}.yml"

- name: Define nginx_user
  ansible.builtin.set_fact:
    nginx_user: "{{ __nginx_user }}"
  when: nginx_user is not defined

# Setup/install tasks.
- name: Setup NGINX on RedHat-family systems
  ansible.builtin.include_tasks: setup-RedHat.yml
  when: ansible_facts.os_family == 'RedHat'

- name: Setup NGINX on Ubuntu
  ansible.builtin.include_tasks: setup-Ubuntu.yml
  when: ansible_facts.distribution == 'Ubuntu'

- name: Setup NGINX on Debian
  ansible.builtin.include_tasks: setup-Debian.yml
  when:
    - ansible_facts.os_family == 'Debian'
    - ansible_facts.distribution != 'Ubuntu'

- name: Setup NGINX on FreeBSD
  ansible.builtin.include_tasks: setup-FreeBSD.yml
  when: ansible_facts.os_family == 'FreeBSD'

- name: Setup NGINX on OpenBSD
  ansible.builtin.include_tasks: setup-OpenBSD.yml
  when: ansible_facts.os_family == 'OpenBSD'

- name: Setup NGINX on Arch Linux
  ansible.builtin.include_tasks: setup-Archlinux.yml
  when: ansible_facts.os_family == 'Archlinux'

- name: Setup NGINX on SUSE
  ansible.builtin.include_tasks: setup-Suse.yml
  when: ansible_facts.os_family == 'Suse'

# Virtual host configuration.
- name: Configure NGINX virtual hosts
  ansible.builtin.import_tasks: vhosts.yml

# NGINX configuration.
- name: Copy NGINX configuration in place
  ansible.builtin.template:
    src: "{{ nginx_conf_template }}"
    dest: "{{ nginx_conf_file_path }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0644"
    validate: nginx -t -c %s
  notify:
    - reload nginx

# NGINX service.
- name: Ensure NGINX service is running as configured
  ansible.builtin.service:
    name: nginx
    state: "{{ nginx_service_state }}"

