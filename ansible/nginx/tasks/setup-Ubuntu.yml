---
- name: Install packages required for the NGINX repository
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
      - ubuntu-keyring
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NGINX signing key
  ansible.builtin.get_url:
    url: "{{ nginx_signing_key_url }}"
    dest: /tmp/nginx_signing.key
    owner: root
    group: root
    mode: "0644"

- name: Inspect downloaded NGINX signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --dry-run
      - --quiet
      - --no-keyring
      - --import
      - --import-options
      - import-show
      - /tmp/nginx_signing.key
  register: nginx_signing_key_inspection
  changed_when: false

- name: Verify NGINX signing key fingerprint
  ansible.builtin.assert:
    that:
      - nginx_signing_fingerprint in nginx_signing_key_inspection.stdout
    fail_msg: >-
      The downloaded NGINX signing key does not contain the expected
      fingerprint. Refusing to configure the repository.

- name: Convert verified NGINX signing key to a keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - "{{ nginx_signing_keyring }}"
      - /tmp/nginx_signing.key
  changed_when: true

- name: Set NGINX signing keyring permissions
  ansible.builtin.file:
    path: "{{ nginx_signing_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure NGINX APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ nginx_signing_keyring }}]
      https://nginx.org/packages/{{
        'mainline/' if nginx_repository_channel == 'mainline' else ''
      }}{{ nginx_repository_os }} {{ ansible_distribution_release }} nginx
    filename: nginx
    state: present
    update_cache: false
  register: nginx_repository_result

- name: Configure APT pinning for NGINX packages
  ansible.builtin.copy:
    dest: "{{ nginx_repository_preferences }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: nginx*
      Pin: origin nginx.org
      Pin: release o=nginx
      Pin-Priority: 900

- name: Ensure NGINX is installed
  ansible.builtin.apt:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: true

- name: Ensure NGINX service is running and enabled at boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true