# Ansible configuration used by both Packer (via ANSIBLE_CONFIG) and local
# validation runs from this directory.
[defaults]
roles_path = roles
collections_paths = collections
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
display_skipped_hosts = True
deprecation_warnings = False
nocows = 1

[ssh_connection]
# SSH multiplexing is intentionally left at Ansible's defaults: the Packer
# ansible provisioner establishes its own proxy/tunnel, including the SSM
# Session Manager tunnel, and manages the SSH arguments itself.
pipelining = True
