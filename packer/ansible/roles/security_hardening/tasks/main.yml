---
- name: Install automatic security update tooling
  ansible.builtin.apt:
    name: "{{ security_hardening_packages }}"
    state: present
    install_recommends: false
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable periodic APT maintenance
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Restrict automatic updates to security origins
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-unattended-upgrades-ami
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "false";
    owner: root
    group: root
    mode: "0644"

- name: Ensure automatic update timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Ensure AppArmor is installed
  ansible.builtin.apt:
    name: apparmor
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Ensure AppArmor is enabled and running
  ansible.builtin.systemd:
    name: apparmor
    enabled: true
    state: started

- name: Verify AppArmor enforcement is active
  ansible.builtin.command: aa-status --enabled
  register: security_hardening_apparmor
  changed_when: false
  failed_when: security_hardening_apparmor.rc != 0

- name: Apply network and kernel hardening sysctls
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: "{{ security_hardening_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl settings

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: "{{ security_hardening_journald_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald retention
  ansible.builtin.copy:
    dest: "{{ security_hardening_journald_dropin }}"
    content: |
      [Journal]
      SystemMaxUse={{ security_hardening_journal_max_use }}
      SystemKeepFree=1G
      MaxRetentionSec={{ security_hardening_journal_retention }}
      Compress=yes
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Harden the SSH daemon
  ansible.builtin.copy:
    dest: "{{ security_hardening_ssh_dropin }}"
    content: "{{ security_hardening_sshd_config }}"
    owner: root
    group: root
    mode: "0600"
    
- name: Ensure SSH privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Validate the resulting SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ security_hardening_disabled_services }}"
  when: item in ansible_facts.services
  failed_when: false

- name: Remove unnecessary legacy packages
  ansible.builtin.apt:
    name: "{{ security_hardening_removed_packages }}"
    state: absent
    purge: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: security_hardening_removed_packages | length > 0

- name: Enforce permissions on sensitive files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ security_hardening_file_permissions }}"
  loop_control:
    label: "{{ item.path }}"

- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_service_mgr == "systemd"
    fail_msg: "The fastfetch_motd role currently supports Ubuntu with systemd."

