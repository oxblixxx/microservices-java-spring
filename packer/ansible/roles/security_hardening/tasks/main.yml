- name: Ensure Fastfetch configuration directory exists
  ansible.builtin.file:
    path: "{{ fastfetch_motd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure MOTD directory exists
  ansible.builtin.file:
    path: /etc/update-motd.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure disabled MOTD archive directory exists
  ansible.builtin.file:
    path: "{{ fastfetch_motd_disabled_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: fastfetch_motd_disable_existing_scripts | bool

- name: Find existing numbered MOTD scripts
  ansible.builtin.find:
    paths: /etc/update-motd.d
    patterns:
      - "[0-9][0-9]-*"
    excludes:
      - "{{ fastfetch_motd_script_name }}"
    file_type: file
    recurse: false
  register: fastfetch_existing_motd_scripts
  become: true
  when: fastfetch_motd_disable_existing_scripts | bool

- name: Check whether archived copies already exist
  ansible.builtin.stat:
    path: "{{ fastfetch_motd_disabled_dir }}/{{ item.path | basename }}"
  loop: "{{ fastfetch_existing_motd_scripts.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: fastfetch_motd_archive_status
  become: true
  when: fastfetch_motd_disable_existing_scripts | bool

- name: Archive existing MOTD scripts
  ansible.builtin.command:
    argv:
      - mv
      - --
      - "{{ item.item.path }}"
      - "{{ fastfetch_motd_disabled_dir }}/{{ item.item.path | basename }}"
  loop: "{{ fastfetch_motd_archive_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  become: true
  changed_when: true
  when:
    - fastfetch_motd_disable_existing_scripts | bool
    - not item.stat.exists

- name: Remove regenerated scripts that are already archived
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ fastfetch_motd_archive_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  become: true
  when:
    - fastfetch_motd_disable_existing_scripts | bool
    - item.stat.exists

- name: Deploy system-wide Fastfetch configuration
  ansible.builtin.template:
    src: config.jsonc.j2
    dest: "{{ fastfetch_motd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Validate Fastfetch configuration

- name: Deploy Fastfetch MOTD script
  ansible.builtin.template:
    src: 99-fastfetch.j2
    dest: "{{ fastfetch_motd_script_path }}"
    owner: root
    group: root
    mode: "0755"
