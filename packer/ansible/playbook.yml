---
# Main playbook for the reusable container-host base image.
#
# Packer runs this with the ansible provisioner. The build host is placed in the
# "packer_build" group, so "all" resolves to the single temporary instance.
#
# Role order matters:
#   1. common              - base OS packages, time sync, optional AWS CLI
#   2. docker              - Docker Engine from Docker's official APT repo
#   3. ssm                 - AWS SSM Agent (Session Manager ready)
#   4. cloudwatch_agent    - optional agent install (no environment config)
#   5. security_hardening  - Docker/SSM-safe Ubuntu 24.04 baseline
#   6. cleanup             - generalise the image (last)
- name: Build the container-host base image
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: common
    - role: docker
    - role: ssm
    - role: cloudwatch_agent
      when: cloudwatch_agent_enabled | default(false) | bool
    - role: security_hardening
    - role: cleanup

