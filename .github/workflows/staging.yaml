name: Deploy Staging

on:
  workflow_run:
    workflows:
      - Publish
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging VPS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: staging

    steps:
      - name: Checkout published revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy and validate staging
        uses: appleboy/ssh-action@v1.2.5
        env:
            STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
            STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
            STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          #envs: STAGING_BASE_URL,STAGING_TEST_EMAIL,STAGING_TEST_PASSWORD
          script: |
            set -euo pipefail

            cd /var/www/html/microservices-java-spring

            export DOCKERHUB_USERNAME=oxblixxx
            export IMAGE_TAG="${{ github.event.workflow_run.head_branch }}"

            echo "======================================"
            echo "Deploying staging"
            echo "Image tag: ${IMAGE_TAG}"
            echo "======================================"

            mkdir -p .staging-state
            touch .staging-state/release.env
            touch .staging-state/rollback.env

            # echo ""
            # echo "==> Capturing current rollback state"
            # source ./scripts/capture-rollback-state.sh

            echo ""
            echo "==> Preparing new release"
            source ./scripts/prepare-release.sh

            echo ""
            echo "==> Loading release environment"
            set -a
            source .env
            source .staging-state/release.env
            set +a

            echo ""
            echo "==> Deploying immutable images"
            docker compose up -d --remove-orphans

            echo ""
            echo "==> Checking service health"

            if bash ./scripts/check-health.sh; then
              echo "All services are healthy."
            else
              echo "Health check failed."

              rollback_failed=0

              while read -r service; do
                [ -z "$service" ] && continue

                echo "Rolling back ${service}..."

                if ! bash ./scripts/rollback-service.sh "$service"; then
                  rollback_failed=1
                fi
              done < .staging-state/failed-services.txt

              docker compose ps

              if [ "$rollback_failed" -ne 0 ]; then
                echo "One or more service rollbacks failed."
              fi

              exit 1
            fi

            echo ""
            echo "==> Running staging smoke tests"
            chmod +x ./integration-tests/smoke-tests.sh
            ./integration-tests/smoke-tests.sh

            echo ""
            echo "==> Running integration tests"
            ./mvnw \
              -f integration-tests/pom.xml \
              test \
              -DbaseUrl="$STAGING_BASE_URL"

            echo ""
            echo "==> Running k6 baseline performance test"
            cd integration-tests/performance

            cp .env.example .env

            sed -i "s/^STAGING_BASE_URL=.*/STAGING_BASE_URL=${STAGING_BASE_URL}/" .env
            sed -i "s/^TEST_EMAIL=.*/TEST_EMAIL=${STAGING_TEST_EMAIL}/" .env
            sed -i "s/^TEST_PASSWORD=.*/TEST_PASSWORD=${STAGING_TEST_PASSWORD}/" .env

            k6 run baseline.js

            echo ""
            echo "==> Running k6 API performance test"
            k6 run api.js

            echo ""
            echo "======================================"
            echo "Staging validation passed."
            echo "======================================"