name: CI

on:
  push:
    tags:
      - "v*.*.*"
#    branches:
#      - main

  pull_request:
    branches:
      - main

concurrency: 
  group: ci-${{ github.workflow }}-${{ github.ref }} 
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write 
jobs:
  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - patient-service
          - billing-service
          - auth-service
          - analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw
      - name: Restore Dependency-Check DB
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-linux-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-linux-

      - name: Unit test
        working-directory: ${{ matrix.service }}
        run: ./mvnw test

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw verify

      - name: Dependency vulnerability scan
        working-directory: ${{ matrix.service }}
        run: ./mvnw dependency-check:check

      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.service }}/target/dependency-check-report.sarif
          category: dependency-check-${{ matrix.service }}

      - name: Upload dependency-check report
        if: always()                      # ← crucial: uploads even when the scan FAILS the build
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.html
          retention-days: 14

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: template
          template: '@/home/runner/.local/bin/trivy-bin/contrib/html.tpl'
          output: trivy-report.html
          # exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          # severity: "CRITICAL,HIGH"

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-report.html
          retention-days: 14
