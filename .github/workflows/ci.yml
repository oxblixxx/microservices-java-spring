name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - patient-service
          - billing-service
          - auth-service
          - analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Restore latest Dependency-Check DB
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-linux-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-linux-

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw verify

      - name: Dependency vulnerability scan
        working-directory: ${{ matrix.service }}
        run: ./mvnw dependency-check:check

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
